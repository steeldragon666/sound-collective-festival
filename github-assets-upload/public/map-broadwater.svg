<path d="M 950 590 L 700 560 L 620 520" stroke="#E8532A" stroke-width="5" stroke-dasharray="12 10" fill="none"/>
<!-- car park -->
<rect x="160" y="120" width="120" height="90" rx="10" fill="#F5E9D0" stroke="#1E323E" stroke-width="4"/>
<text x="220" y="172" font-family="monospace" font-weight="bold" font-size="34" fill="#1E323E" text-anchor="middle">P</text>
<text x="296" y="168" font-family="monospace" font-weight="bold" font-size="20" fill="#1E323E">CAREY PARK</text>
<text x="296" y="194" font-family="monospace" font-weight="bold" font-size="20" fill="#1E323E">CAR PARK</text>
<!-- compass -->
<g transform="translate(1280 120)"><circle r="34" fill="#F5E9D0" stroke="#1E323E" stroke-width="4"/><path d="M 0 -24 L 10 10 L 0 4 L -10 10 Z" fill="#E8532A"/><text y="-44" font-family="monospace" font-weight="bold" font-size="22" fill="#1E323E" text-anchor="middle">N</text></g>
