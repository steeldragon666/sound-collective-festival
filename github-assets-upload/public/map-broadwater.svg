<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#D8B98A"/>
<!-- broadwater -->
<path d="M 900 0 L 1400 0 L 1400 900 L 820 900 Q 900 640 880 420 Q 862 200 900 0 Z" fill="#8FB6C9"/>
<path d="M 905 0 Q 868 210 886 420 Q 906 640 826 900" fill="none" stroke="#F5E9D0" stroke-width="5" stroke-dasharray="18 12"/>
<text x="1130" y="300" font-family="monospace" font-weight="bold" font-size="34" fill="#F5E9D0" transform="rotate(78 1130 300)">THE BROADWATER</text>
<!-- park green -->
<path d="M 180 120 L 700 80 Q 860 200 850 400 Q 840 620 700 760 L 200 820 Q 120 500 180 120 Z" fill="#5B5B3A" opacity="0.9"/>
<text x="430" y="220" font-family="monospace" font-weight="bold" font-size="40" fill="#F5E9D0">BROADWATER</text>
<text x="460" y="268" font-family="monospace" font-weight="bold" font-size="40" fill="#F5E9D0">PARKLANDS</text>
<!-- roads -->
<path d="M 60 0 L 40 900" stroke="#F5E9D0" stroke-width="26" fill="none"/>
<path d="M 60 0 L 40 900" stroke="#1E323E" stroke-width="3" stroke-dasharray="20 16" fill="none"/>
<text x="18" y="500" font-family="monospace" font-weight="bold" font-size="26" fill="#1E323E" transform="rotate(-90 18 500)">GOLD COAST HWY</text>
<path d="M 40 700 L 900 690" stroke="#F5E9D0" stroke-width="22" fill="none"/>
<text x="420" y="678" font-family="monospace" font-weight="bold" font-size="24" fill="#1E323E">MARINE PARADE</text>
<path d="M 100 380 L 880 380" stroke="#F5E9D0" stroke-width="18" fill="none"/>
<text x="360" y="368" font-family="monospace" font-weight="bold" font-size="22" fill="#1E323E">ADA BELL WAY</text>
<!-- festival site -->
<rect x="380" y="420" width="240" height="180" rx="18" fill="#E8532A" stroke="#1E323E" stroke-width="5"/>
