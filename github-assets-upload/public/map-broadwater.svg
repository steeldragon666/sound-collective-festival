<text x="500" y="534" font-family="monospace" font-weight="bold" font-size="26" fill="#F5E9D0" text-anchor="middle">ENTRY</text>
<path d="M 500 380 L 500 420" stroke="#E8532A" stroke-width="6" stroke-dasharray="10 8"/>
<!-- tram stations -->
<g stroke="#1E323E" stroke-width="4">
<circle cx="52" cy="300" r="18" fill="#F5E9D0"/><circle cx="50" cy="640" r="18" fill="#F5E9D0"/>
</g>
<text x="82" y="292" font-family="monospace" font-weight="bold" font-size="20" fill="#1E323E">TRAM · PARKLANDS</text>
<text x="80" y="632" font-family="monospace" font-weight="bold" font-size="20" fill="#1E323E">TRAM · SOUTHPORT SOUTH</text>
<path d="M 70 300 L 300 340 L 380 430" stroke="#E8532A" stroke-width="5" stroke-dasharray="12 10" fill="none"/>
<path d="M 68 640 L 330 600 L 420 600" stroke="#E8532A" stroke-width="5" stroke-dasharray="12 10" fill="none"/>
<!-- bus -->
<rect x="150" y="440" width="26" height="26" rx="6" fill="#2E4A5E"/>
<text x="188" y="462" font-family="monospace" font-weight="bold" font-size="20" fill="#1E323E">BUS · AUSTRALIA FAIR</text>
<path d="M 176 470 L 300 480 L 380 490" stroke="#E8532A" stroke-width="5" stroke-dasharray="12 10" fill="none"/>
<!-- ferry pier -->
<path d="M 950 560 L 1100 560" stroke="#F5E9D0" stroke-width="10"/>
<circle cx="1100" cy="560" r="16" fill="#F5E9D0" stroke="#1E323E" stroke-width="4"/>
